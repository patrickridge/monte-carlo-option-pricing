[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcop"
version = "0.1.0"
description = "Monte Carlo option pricing, Greeks, and strategy backtesting (European + American via LSM)"
readme = "README.md"
authors = [{name="Patrick Ridge"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]
# Optional: only needed for market_data.fetch_price_history(). The library works
# offline via load_price_csv() or synthetic_price_history(), so this is kept out
# of the hard dependencies rather than tying the install to a scraping package.
data = ["yfinance"]

[project.urls]
Homepage = "https://github.com/patrickridge/monte-carlo-option-pricing"
Repository = "https://github.com/patrickridge/monte-carlo-option-pricing"

[project.scripts]
mcop = "mcop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
